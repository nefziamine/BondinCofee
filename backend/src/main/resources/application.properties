bondin.ai.model=${BONDIN_AI_MODEL:gemini-2.5-flash}
bondin.ai.temperature=${BONDIN_AI_TEMPERATURE:0.25}
bondin.ai.maxOutputTokens=${BONDIN_AI_MAX_OUTPUT_TOKENS:512}
