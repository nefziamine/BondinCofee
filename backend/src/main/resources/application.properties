server.port=8080

# PERSISTENT FILE DATABASE
spring.datasource.url=jdbc:h2:file:./bondindb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# POSTGRES (Commented out)
# spring.datasource.url=jdbc:postgresql://localhost:5432/stage_finale_db
# spring.datasource.username=postgres
# spring.datasource.password=123456
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.h2.console.enabled=true

# AI CONFIG (set BONDIN_AI_KEY in your environment; never commit real keys)
bondin.ai.key=${BONDIN_AI_KEY:}