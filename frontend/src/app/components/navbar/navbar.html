    <div class="brand" routerLink="/">
      <span class="brand-name">BONDIN</span>
    </div>
    
    <div class="nav-links">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">L'Art du Café</a>
