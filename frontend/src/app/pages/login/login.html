<div class="login-container">
  <div class="form-card">
  <div class="brand">
  <div class="logo-wrapper">
    <img src="assets/images/logobondin.png" alt="logo" />
  </div>
  <h2>Connexion</h2>
</div>
  <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">

    <div class="form-group">
      <input type="email" placeholder="Email" formControlName="email" />
      <small *ngIf="loginForm.get('email')?.invalid && loginForm.get('email')?.touched">
        Email invalide
      </small>
    </div>

    <div class="form-group">
      <input type="password" placeholder="Mot de passe" formControlName="password" />
      <small *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched">
        Minimum 6 caractères
      </small>
    </div>

    <button type="submit" [disabled]="loading">
      {{ loading ? 'Connexion...' : 'Se connecter' }}
    </button>
    
    <div class="forgot-link-wrapper">
      <a routerLink="/forgot-password" class="forgot-password">Mot de passe oublié ?</a>
    </div>

    <div class="error" *ngIf="errorMessage">
      {{ errorMessage }}
    </div>
  </form>

  <p class="redirect">
    Pas de compte ? <a routerLink="/register">S'inscrire</a>
  </p>
  <div class="footer">
        © 2026 BONDIN Tunisie — Système interne
      </div>
</div>
</div>
