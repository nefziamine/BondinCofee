<div class="login-page">
  <div class="login-container">
    <div class="login-box">
      <header class="login-header">
        <span class="ui-label">Cabinet de Gestion</span>
        <h1>Accès Interne</h1>
        <p class="subtitle">L’Excellence Opérationnelle depuis 1910</p>
      </header>

      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">
        <div class="form-group">
          <label for="email">Identifiant (Email)</label>
          <input type="email" id="email" formControlName="email" placeholder="votre.nom@cafesbondin.tn">
          <div *ngIf="loginForm.get('email')?.touched && loginForm.get('email')?.invalid" class="error">
            L'identifiant est requis.
          </div>
        </div>

        <div class="form-group">
          <label for="password">Mot de passe</label>
          <input type="password" id="password" formControlName="password" placeholder="••••••••">
          <div *ngIf="loginForm.get('password')?.touched && loginForm.get('password')?.invalid" class="error">
            Le mot de passe est obligatoire.
          </div>
        </div>

        <div *ngIf="errorMessage" class="error-message">
          {{ errorMessage }}
        </div>

        <div class="form-actions">
          <button type="submit" [disabled]="loading" class="btn-bondin-red">
            {{ loading ? 'Chargement...' : 'Entrer dans la maison →' }}
          </button>
        </div>
      </form>

      <footer class="login-footer">
        <a routerLink="/forgot-password">Accès oublié ?</a>
        <span>·</span>
        <a routerLink="/register">Demander un accès</a>
      </footer>
    </div>
  </div>
</div>
