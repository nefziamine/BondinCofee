<div class="forgot-container">
  <div class="form-card">
    <div class="brand">
      <div class="logo-wrapper">
        <img src="assets/images/logobondin.png" alt="logo" />
      </div>
      <h2>Mot de passe oublié</h2>
    </div>

    <form [formGroup]="forgotForm" (ngSubmit)="onSubmit()" *ngIf="!message || isError">
      <p class="instr">Entrez votre email pour recevoir un lien de réinitialisation.</p>
      
      <div class="form-group">
        <input type="email" placeholder="Votre Email" formControlName="email" />
        <small *ngIf="forgotForm.get('email')?.invalid && forgotForm.get('email')?.touched">
          Email invalide
        </small>
      </div>

      <button type="submit" [disabled]="loading">
        {{ loading ? 'Envoi...' : 'Envoyer le lien' }}
      </button>

      <div class="error" *ngIf="isError">
        {{ message }}
      </div>
    </form>

    <div class="success-message" *ngIf="message && !isError">
      <p>{{ message }}</p>
      <a routerLink="/login" class="back-link">Retour à la connexion</a>
    </div>

    <p class="redirect" *ngIf="!message || isError">
      <a routerLink="/login">Retour à la connexion</a>
    </p>
  </div>
</div>
