<div class="forgot-container">
  <div class="form-card">
    <div class="brand">
      <div class="logo-wrapper">
        <img src="assets/images/logobondin.png" alt="logo" />
      </div>
      <h2>{{ 'PWD.FORGOT' | translate }}</h2>
    </div>

    <form [formGroup]="forgotForm" (ngSubmit)="onSubmit()" *ngIf="!message || isError">
      <p class="instr">{{ 'PWD.INSTR' | translate }}</p>
      
      <div class="form-group">
        <input type="email" [placeholder]="'PROF.EMAIL' | translate" formControlName="email" />
        <small *ngIf="forgotForm.get('email')?.invalid && forgotForm.get('email')?.touched">
          {{ 'PWD.INVALID' | translate }}
        </small>
      </div>

      <button type="submit" [disabled]="loading">
        {{ loading ? ('PWD.SENDING' | translate) : ('PWD.SEND' | translate) }}
      </button>

      <div class="error" *ngIf="isError">
        {{ message }}
      </div>
    </form>

    <div class="success-message" *ngIf="message && !isError">
      <p>{{ message }}</p>
      <a routerLink="/login" class="back-link">{{ 'PWD.BACK' | translate }}</a>
    </div>

    <p class="redirect" *ngIf="!message || isError">
      <a routerLink="/login">{{ 'PWD.BACK' | translate }}</a>
    </p>
  </div>
</div>
