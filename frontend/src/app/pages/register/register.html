<div class="register-page">
  <div class="register-container">
    <div class="register-box">
      <header class="register-header">
        <span class="ui-label">Portail Interne</span>
        <h1>Rejoindre</h1>
        <p class="subtitle">BONDIN Tunisie — Tradition & Excellence</p>
      </header>

      <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" class="register-form">
        <div class="form-group">
          <label>Identité (Nom complet)</label>
          <input type="text" formControlName="fullName" placeholder="Votre nom complet">
        </div>

        <div class="form-group">
          <label>Affectation (Email professionnel)</label>
          <input type="email" formControlName="email" placeholder="votre.nom@cafesbondin.tn">
        </div>

        <div class="form-group">
          <label>Mot de passe</label>
          <input type="password" formControlName="password" placeholder="••••••••">
        </div>

        <div class="form-actions">
          <button type="submit" [disabled]="loading" class="btn-bondin-red">
            {{ loading ? 'Enregistrement...' : 'Solliciter un compte →' }}
          </button>
        </div>
      </form>

      <footer class="register-footer">
        <p>Déjà membre de la maison ? <a routerLink="/login">Se connecter</a></p>
      </footer>
    </div>
  </div>
</div>
