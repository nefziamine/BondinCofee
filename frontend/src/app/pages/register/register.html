<div class="register-page">
  <div class="register-container">
    <div class="register-box">
      <header class="register-header">
        <span class="ui-label">{{ 'AUTH.LOGIN_CABINET' | translate }}</span>
        <h1>{{ 'AUTH.REG_TITLE' | translate }}</h1>
        <p class="subtitle">{{ 'AUTH.LOGIN_SUB' | translate }}</p>
      </header>

      <div *ngIf="errorMessage" class="error-banner">
        <span>⚠️</span> {{ errorMessage }}
      </div>

      <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" class="register-form">
        <div class="form-group">
          <label>{{ 'AUTH.REG_NAME' | translate }}</label>
          <input type="text" formControlName="fullName" placeholder="Votre nom complet">
        </div>

        <div class="form-group">
          <label>{{ 'AUTH.LOGIN_ID' | translate }}</label>
          <input type="email" formControlName="email" placeholder="votre.nom@cafesbondin.tn">
        </div>

        <div class="form-group">
          <label>{{ 'AUTH.REG_ROLE' | translate }}</label>
          <select formControlName="role" class="bondin-select">
            <option value="EMPLOYE">{{ 'AUTH.REG_ROLE_EMP' | translate }}</option>
            <option value="RH">{{ 'AUTH.REG_ROLE_RH' | translate }}</option>
            <option value="IT">{{ 'AUTH.REG_ROLE_IT' | translate }}</option>
          </select>
        </div>

        <div class="form-group">
          <label>{{ 'AUTH.LOGIN_PWD' | translate }}</label>
          <input type="password" formControlName="password" placeholder="••••••••">
        </div>

        <div class="form-actions">
          <button type="submit" class="btn-register-submit" [disabled]="loading">
            {{ loading ? ('AUTH.REG_LOADING' | translate) : ('AUTH.REG_BTN' | translate) }}
          </button>
        </div>
      </form>

      <footer class="register-footer">
        <p>{{ 'AUTH.REG_MEMBER' | translate }} <a routerLink="/login">{{ 'AUTH.REG_LOGIN' | translate }}</a></p>
      </footer>
    </div>
  </div>
</div>
